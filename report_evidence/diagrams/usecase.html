<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}
svg{display:block;font-family:"Segoe UI",Arial,sans-serif}
.uc{fill:#eef4fb;stroke:#2f5d8a;stroke-width:1.6}
.uct{font-size:13px;fill:#13324f;text-anchor:middle;dominant-baseline:middle}
.act{stroke:#222;stroke-width:2;fill:none}
.actl{font-size:15px;font-weight:600;text-anchor:middle;fill:#111}
.ln{stroke:#555;stroke-width:1.3}
.sys{fill:none;stroke:#2f5d8a;stroke-width:2;rx:10}
.syst{font-size:16px;font-weight:700;fill:#2f5d8a}
.gen{stroke:#222;stroke-width:1.5;fill:none}
.note{font-size:12px;fill:#444}
</style></head><body>
<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <rect class="sys" x="200" y="20" width="600" height="600" rx="12"/>
  <text class="syst" x="215" y="45">SuperMart system boundary</text>

  <!-- actors -->
  <g id="guest" transform="translate(95,120)">
    <circle class="act" cx="0" cy="0" r="14"/><line class="act" x1="0" y1="14" x2="0" y2="55"/>
    <line class="act" x1="-22" y1="30" x2="22" y2="30"/><line class="act" x1="0" y1="55" x2="-18" y2="85"/><line class="act" x1="0" y1="55" x2="18" y2="85"/>
    <text class="actl" x="0" y="108">Guest</text>
  </g>
  <g id="cust" transform="translate(95,380)">
    <circle class="act" cx="0" cy="0" r="14"/><line class="act" x1="0" y1="14" x2="0" y2="55"/>
    <line class="act" x1="-22" y1="30" x2="22" y2="30"/><line class="act" x1="0" y1="55" x2="-18" y2="85"/><line class="act" x1="0" y1="55" x2="18" y2="85"/>
    <text class="actl" x="0" y="108">Customer</text>
  </g>
  <g id="mgr" transform="translate(905,300)">
    <circle class="act" cx="0" cy="0" r="14"/><line class="act" x1="0" y1="14" x2="0" y2="55"/>
    <line class="act" x1="-22" y1="30" x2="22" y2="30"/><line class="act" x1="0" y1="55" x2="-18" y2="85"/><line class="act" x1="0" y1="55" x2="18" y2="85"/>
    <text class="actl" x="0" y="108">Store Manager</text>
  </g>
  <!-- generalisation: Customer is a Guest with an account -->
  <line class="gen" x1="95" y1="365" x2="95" y2="245"/>
  <polygon points="95,232 86,248 104,248" fill="#fff" stroke="#222" stroke-width="1.5"/>

  <!-- shared / guest use cases -->
  <ellipse class="uc" cx="370" cy="85"  rx="140" ry="24"/><text class="uct" x="355" y="85">Browse, search and filter catalogue</text>
  <ellipse class="uc" cx="355" cy="145" rx="128" ry="24"/><text class="uct" x="355" y="145">Manage cart and apply promo code</text>
  <ellipse class="uc" cx="355" cy="205" rx="128" ry="24"/><text class="uct" x="355" y="205">Place order (fn_place_order)</text>
  <ellipse class="uc" cx="355" cy="265" rx="128" ry="24"/><text class="uct" x="355" y="265">Register account (fn_register_user)</text>
  <!-- customer -->
  <ellipse class="uc" cx="355" cy="345" rx="128" ry="24"/><text class="uct" x="355" y="345">Log in (fn_login)</text>
  <ellipse class="uc" cx="355" cy="405" rx="128" ry="24"/><text class="uct" x="355" y="405">View own order history</text>
  <ellipse class="uc" cx="355" cy="465" rx="128" ry="24"/><text class="uct" x="355" y="465">Write / edit / delete review</text>
  <ellipse class="uc" cx="355" cy="525" rx="128" ry="24"/><text class="uct" x="355" y="525">Change password (fn_change_password)</text>
  <!-- manager -->
  <ellipse class="uc" cx="650" cy="130" rx="128" ry="24"/><text class="uct" x="650" y="130">Add / delete products</text>
  <ellipse class="uc" cx="650" cy="200" rx="128" ry="24"/><text class="uct" x="650" y="200">Ship / deliver / cancel order</text>
  <ellipse class="uc" cx="650" cy="270" rx="128" ry="24"/><text class="uct" x="650" y="270">Restock low stock (cursor)</text>
  <ellipse class="uc" cx="650" cy="340" rx="128" ry="24"/><text class="uct" x="650" y="340">View all orders</text>
  <ellipse class="uc" cx="650" cy="410" rx="128" ry="24"/><text class="uct" x="650" y="410">Reset user password</text>
  <ellipse class="uc" cx="650" cy="480" rx="128" ry="24"/><text class="uct" x="650" y="480">Delete user account</text>
  <ellipse class="uc" cx="650" cy="560" rx="128" ry="24" style="stroke-dasharray:5 4"/><text class="uct" x="650" y="560">Category discount (SQL editor only)</text>

  <!-- guest links -->
  <line class="ln" x1="120" y1="150" x2="230" y2="85"/>
  <line class="ln" x1="120" y1="150" x2="230" y2="145"/>
  <line class="ln" x1="120" y1="150" x2="230" y2="205"/>
  <line class="ln" x1="120" y1="150" x2="230" y2="265"/>
  <!-- customer links -->
  <line class="ln" x1="120" y1="410" x2="230" y2="345"/>
  <line class="ln" x1="120" y1="410" x2="230" y2="405"/>
  <line class="ln" x1="120" y1="410" x2="230" y2="465"/>
  <line class="ln" x1="120" y1="410" x2="230" y2="525"/>
  <!-- manager links -->
  <line class="ln" x1="880" y1="330" x2="778" y2="130"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="200"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="270"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="340"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="410"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="480"/>
  <line class="ln" x1="880" y1="330" x2="778" y2="560" style="stroke-dasharray:5 4"/>
</svg>
</body></html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperMart - Modern E-Commerce Store & DB Portal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
       
    

:root {
    --primary: #0d9488;
    --primary-hover: #0f766e;
    --primary-light: #f0fdfa;
    --secondary: #1c1917;
    --accent: #f59e0b;
    --warning: #f59e0b;
    --danger: #e11d48;
    --manager-purple: #9333ea;
    --bg-page: #faf9f7;
    --bg-card: #ffffff;
    --border: #e7e5e4;
    --text-main: #1c1917;
    --text-muted: #78716c;
    --shadow-sm: 0 1px 3px rgba(28, 25, 23, 0.06);
    --shadow-md: 0 6px 18px rgba(28, 25, 23, 0.08);
    --shadow-lg: 0 14px 32px rgba(28, 25, 23, 0.14);
    --radius-md: 10px;
    --radius-lg: 14px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: var(--bg-page);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}


.topbar {
    background: #134e4a;
    color: white;
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid var(--accent);
    box-shadow: 0 2px 10px rgba(19, 78, 74, 0.2);
    position: sticky;
    top: 0;
    z-index: 100;
}

.site-title {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.site-logo {
    font-size: 24px;
    background: rgba(255, 255, 255, 0.12);
    padding: 6px 12px;
    border-radius: 10px;
    transition: transform 0.2s;
}

.site-title:hover .site-logo { transform: scale(1.06); }

.site-title h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #ffffff;
}

.site-title p {
    font-size: 11px;
    color: #99d5cf;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.db-status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
}

.db-status-badge:hover { background: rgba(255, 255, 255, 0.18); }

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 6px #34d399;
}

.status-dot.demo {
    background: #fbbf24;
    box-shadow: 0 0 6px #fbbf24;
}

.role-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.role-pill.manager {
    background: #f3e8ff;
    color: var(--manager-purple);
    border: 1px solid #d8b4fe;
}

.role-pill.customer {
    background: #ccfbf1;
    color: #0f766e;
    border: 1px solid #99f6e4;
}

.role-pill.guest {
    background: #f5f5f4;
    color: #57534e;
    border: 1px solid #d6d3d1;
}

.cart-header-btn {
    background: var(--accent);
    color: #1c1917;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, transform 0.15s;
}

.cart-header-btn:hover {
    background: #fbbf24;
    transform: translateY(-1px);
}

.cart-badge {
    background: #134e4a;
    color: #ffffff;
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 800;
}


.container {
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    gap: 20px;
    padding: 24px;
    max-width: 1440px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
}

@media (max-width: 1080px) {
    .container { grid-template-columns: 220px 1fr; }
    .profile-sidebar { grid-column: span 2; }
}

@media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .profile-sidebar { grid-column: span 1; }
}


.box {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 20px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}

.box h2 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 14px;
    color: var(--secondary);
    display: flex;
    align-items: center;
    gap: 8px;
}


.menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.menu-heading {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    margin: 10px 0 4px 6px;
}

.menu button {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    background: #f5f5f4;
    color: var(--secondary);
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid transparent;
}

.menu button:hover {
    background: #ffffff;
    transform: translateX(3px);
    border-color: var(--border);
}

.menu button.active {
    background: var(--primary);
    color: white;
    font-weight: 600;
}

.menu button.manager-btn {
    background: #faf5ff;
    color: var(--manager-purple);
    border: 1px solid #e9d5ff;
}

.menu button.manager-btn:hover { background: #f3e8ff; }

.menu button.manager-btn.active {
    background: var(--manager-purple);
    color: white;
}

.menu-divider {
    height: 1px;
    background: var(--border);
    margin: 10px 0;
}


.tools {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px;
    background: #f5f5f4;
    border-radius: var(--radius-md);
    align-items: center;
    flex-wrap: wrap;
}

.search-bar-container {
    display: flex;
    flex: 1;
    gap: 8px;
    min-width: 280px;
    position: relative;
    align-items: center;
}

.search-bar {
    flex: 1;
    width: 100%;
    min-width: 0;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: white;
    font-size: 14px;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
}

.search-bar:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
}

.ai-search-btn {
    background: #134e4a;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    white-space: nowrap;
}

.ai-search-btn:hover { background: #0f766e; }

.ai-search-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.sort-select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: white;
    font-size: 13.5px;
    color: var(--secondary);
    outline: none;
    cursor: pointer;
}

.sort-select:focus { border-color: var(--primary); }


.cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    background: white;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    position: relative;
}

.card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: #99d5cf;
}

.card-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    background: #fef3c7;
    color: #b45309;
    font-weight: 700;
}

.icon {
    font-size: 44px;
    margin: 10px 0;
    text-align: center;
    background: #f0fdfa;
    border-radius: 10px;
    padding: 12px;
}

.card h3 {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 6px;
}

.card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.4;
    flex: 1;
}

.card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.price {
    font-size: 17px;
    font-weight: 800;
    color: var(--primary);
}

.rating {
    font-size: 12px;
    color: #b45309;
    font-weight: 600;
}

.stock-indicator {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 10px;
}

.quantity-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f5f5f4;
    border-radius: 8px;
    padding: 3px;
    gap: 6px;
}

.qty-btn {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.qty-btn.minus {
    background: #e7e5e4;
    color: var(--secondary);
}

.qty-btn.minus:hover { background: #d6d3d1; }

.qty-btn.plus {
    background: var(--primary);
    color: white;
}

.qty-btn.plus:hover { background: var(--primary-hover); }

.qty-text {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--secondary);
}

.add-btn-basket {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.add-btn-basket:hover { background: var(--primary-hover); }
.add-btn-basket:active { transform: scale(0.98); }


.cart-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}

.cart-item-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafaf9;
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: var(--radius-md);
}

.cart-item-info {
    display: flex;
    align-items: center;
    gap: 12px;
}

.cart-item-icon {
    font-size: 28px;
    background: white;
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
}

.cart-item-actions {
    display: flex;
    align-items: center;
    gap: 14px;
}

.delete-btn {
    background: #ffe4e6;
    color: var(--danger);
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    transition: background 0.2s;
}

.delete-btn:hover { background: #fecdd3; }

.clear-btn {
    background: #ffe4e6;
    color: var(--danger);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
}

.clear-btn:hover { background: #fecdd3; }


.checkout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

@media (max-width: 768px) {
    .checkout-grid { grid-template-columns: 1fr; }
}

.form-group { margin-bottom: 12px; }

.form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--secondary);
    margin-bottom: 5px;
}

.form-control {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13.5px;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
}

.form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
}

.checkout-summary {
    background: #fafaf9;
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: var(--radius-md);
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 13.5px;
    color: var(--text-muted);
}

.summary-row.total {
    border-top: 2px dashed var(--border);
    margin-top: 8px;
    padding-top: 12px;
    font-size: 17px;
    font-weight: 800;
    color: var(--secondary);
}

.coupon-box {
    display: flex;
    gap: 8px;
    margin: 12px 0;
}

.coupon-btn {
    padding: 9px 14px;
    background: #e7e5e4;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.coupon-btn:hover { background: #d6d3d1; }

.place-order-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #1c1917;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.2s, transform 0.15s;
}

.place-order-btn:hover {
    background: #d97706;
    color: white;
}

.place-order-btn:active { transform: scale(0.99); }


.orders-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.order-card {
    background: #fafaf9;
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    border-radius: var(--radius-md);
    padding: 16px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 10px;
}

.order-status {
    background: #ccfbf1;
    color: #0f766e;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 12px;
}


.auth-container {
    max-width: 480px;
    margin: 30px auto;
    background: white;
    border: 1px solid var(--border);
    border-top: 4px solid var(--primary);
    border-radius: var(--radius-lg);
    padding: 28px;
    box-shadow: var(--shadow-md);
}

.auth-tabs {
    display: flex;
    border-bottom: 2px solid #f5f5f4;
    margin-bottom: 20px;
}

.auth-tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    font-weight: 600;
    font-size: 14px;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.2s;
}

.auth-tab-btn:hover { color: var(--primary); }

.auth-tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
}

.quick-role-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
}

.quick-role-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafaf9;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
}

.quick-role-btn:hover {
    background: #f0fdfa;
    border-color: #99d5cf;
}


.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(28, 25, 23, 0.55);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal-card {
    background: white;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 520px;
    padding: 24px;
    box-shadow: var(--shadow-lg);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: #f5f5f4;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-weight: 700;
    transition: background 0.2s;
}

.modal-close:hover { background: #e7e5e4; }


.toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1c1917;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2000;
    font-size: 13.5px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}


.db-flow-toast {
    position: fixed;
    bottom: 16px;
    left: 20px;
    right: 20px;
    max-width: 980px;
    margin: 0 auto;
    background: #1c1917;
    color: white;
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    z-index: 2500;
    border: 1px solid #44403c;
    animation: slideUp 0.3s ease;
}

.db-flow-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    margin-top: 10px;
}

.db-flow-step {
    background: #292524;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #44403c;
    font-size: 11.5px;
}

.db-flow-step-title {
    font-size: 10.5px;
    font-weight: 700;
    color: #5eead4;
    text-transform: uppercase;
    margin-bottom: 4px;
}

.db-flow-step-code {
    font-family: Consolas, monospace;
    font-size: 11px;
    color: #fcd34d;
    word-break: break-all;
    line-height: 1.3;
}

@keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
    </style>
</head>

<body>

    
    <header class="topbar">
        <div class="site-title" onclick="setView('shop', 'All')">
            <div class="site-logo">⚡</div>
            <div>
                <h1>SuperMart</h1>
                <p>Enterprise E-Commerce & Supabase Database</p>
            </div>
        </div>

        <div class="topbar-right">
            
            <button class="db-status-badge"
                style="background: rgba(168, 85, 247, 0.2); border-color: rgba(216, 180, 254, 0.4); color: #f3e8ff;"
                onclick="openGeminiModal()" title="Configure Gemini AI Search API Key">
                <span>✨ Gemini AI Key</span>
            </button>

            
            <button class="db-status-badge"
                style="background: rgba(99, 102, 241, 0.2); border-color: rgba(165, 180, 252, 0.4); color: #e0e7ff;"
                onclick="openDbFlowModal()" title="View Interactive Database Demonstration Flow">
                <span>📊 Interactive DB Flow</span>
            </button>

            
            <div id="headerRoleBadge"></div>

            
            <div class="db-status-badge" id="dbStatusBadge" onclick="openSupabaseModal()"
                title="Configure Supabase Database">
                <span class="status-dot demo" id="dbDot"></span>
                <span id="dbStatusText">Supabase: Connecting...</span>
            </div>

            
            <button class="cart-header-btn" onclick="setView('cart')">
                🛒 Cart <span class="cart-badge" id="headerCartCount">0</span>
            </button>
        </div>
    </header>

    
    <main id="mainContainer">
        
    </main>

    
    <div id="modalContainer"></div>

    
    <div id="toastContainer"></div>

    <script>




        const DEFAULT_PRODUCTS = [

            { id: 1, name: "Apple iPhone 15 Pro", category: "Electronics", price: 999.00, icon: "📱", stock: 15, rating: 4.9, description: "Titanium design with A17 Pro chip and 48MP camera system." },
            { id: 2, name: "MacBook Air M2", category: "Electronics", price: 1199.00, icon: "💻", stock: 10, rating: 4.8, description: "13.6-inch Liquid Retina display, 18-hour battery life." },

        const SEARCH_STOPWORDS = new Set(["i","a","an","the","need","want","looking","for","to","buy","get","me","my","some","show","find","please","with","and","or","of","in","on","is","are","do","you","have","any","can","something","like","that","good","best","new","am","im","it","thinking","making","make","something","cook","cooking","would","love","craving","today","tonight","what","about","ideas","hungry","eat","eating","tasty"]);
        function keywordFilter(list, query) {
            const norm = t => t.toLowerCase().replace(/[^a-z0-9\s]/g, " ");
            const stem = w => w.length > 3 && w.endsWith("s") ? w.slice(0, -1) : w;
            const words = norm(query).split(/\s+/).filter(w => w && !SEARCH_STOPWORDS.has(w)).map(stem);
            if (!words.length) return list;
            const SYNONYMS = {
                cheese: ["cheese","mozzarella","cheddar","parmesan","mac"],
                cheesy: ["cheese","mozzarella","cheddar","parmesan","mac"],
                sweet: ["chocolate","cookie","ice cream","honey","dessert","sweet"],
                dessert: ["chocolate","cookie","ice cream","dessert"],
                spicy: ["spicy","masala","biryani","chicken"],
                snack: ["snack","chips","nachos","cookie","nuts"],
                snacks: ["snack","chips","nachos","cookie","nuts"],
                pasta: ["pasta","penne","mac","noodle"],
                meal: ["meal","biryani","chicken","pizza","pasta","mac"],
                dinner: ["meal","biryani","chicken","pizza","pasta","mac","rice"],
                lunch: ["meal","biryani","chicken","pizza","pasta","mac","rice","bread"],
                breakfast: ["bread","yogurt","honey","coffee","almond"],
                drink: ["coffee","cold brew"],
                headphone: ["headphone","airpod","sony","earbud"],
                earphone: ["headphone","airpod","earbud"],
                earbuds: ["airpod","headphone","earbud"],
                phone: ["iphone","phone"],
                laptop: ["macbook","laptop"],
                shoe: ["nike","sneaker","jordan"],
                shoes: ["nike","sneaker","jordan"]
            };
            const variants = w => { const v = [w]; if (w.length > 4 && w.endsWith("y")) { v.push(w.slice(0, -1) + "e"); v.push(w.slice(0, -1)); } return v; };
            const scored = list.map(p => {
                const hay = norm(`${p.name} ${p.category} ${p.description || ""}`);
                const nameHay = norm(p.name);
                let score = 0;
                words.forEach(w => {
                    const vs = variants(w);
                    const syn = (SYNONYMS[w] || []).map(x => new RegExp("\\b" + x + "(s|es)?\\b"));
                    if (vs.some(x => nameHay.includes(x)) || syn.some(r => r.test(nameHay))) score += 3;
                    else if (vs.some(x => hay.includes(x)) || syn.some(r => r.test(hay))) score += 1;
                });
                return { p, score };
            }).filter(x => x.score > 0);
            scored.sort((x, y) => y.score - x.score);
            return scored.map(x => x.p);
        }

        async function executeAiSearch() {
            const searchInput = document.getElementById("mainSearchInput");
            const userQuery = searchInput ? searchInput.value.trim() : state.search.trim();

            state.search = userQuery;
            state.aiError = "";
            if (!userQuery) {
                showToast("Please enter a prompt or product query to search!");
                state.aiSearchResults = null;
                render();
                return;
            }

            if (!geminiApiKey) {
                openGeminiModal();
                showToast("Please enter your Gemini API Key first!");
                return;
            }

            if (state.isAiSearching) return;
            state.aiSearchResults = null;
            state.isAiSearching = true;
            render();


            const catalogLines = state.products.map(p =>
                `${p.id} | ${p.name} | ${p.category} | $${p.price} | ${p.description || ""}`
            ).join("\n");

            const prompt = `You are an AI assistant embedded in an e-commerce search bar.
Analyze the user's intent and select matching product IDs from the inventory list.

User Search Query: "${userQuery}"

Catalog Inventory (format: id | name | category | price | description):
${catalogLines}

Rules:
- Understand the intent behind the query (cravings, meals, recipes, moods, occasions), not just exact words. Example: "something cheesy" should return ready meals AND cheese-based foods or cheese ingredients such as mac and cheese, cheese pizza, mozzarella, cheddar, nachos.
- Be generous: include every product that plausibly fits (up to 12), best matches first.
- Only use IDs that exist in the catalog.
Return ONLY a valid JSON array of the matching product IDs (numbers), e.g. [1, 5, 8]. If nothing is relevant return []. No markdown, no explanation.`;

            const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-flash-latest"];
            const deadline = Date.now() + 8000;
            let data = null, errMsg = "";

            try {
                for (const model of models) {
                    const remaining = deadline - Date.now();
                    if (remaining < 1500) { errMsg = errMsg || "Request timed out"; break; }
                    const ctrl = new AbortController();
                    const timer = setTimeout(() => ctrl.abort(), Math.min(6000, remaining));
                    try {
                        const gen = { responseMimeType: "application/json", temperature: 0 };
                        if (model.startsWith("gemini-2.5")) gen.thinkingConfig = { thinkingBudget: 0 };
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                            method: "POST",
                            signal: ctrl.signal,
                            headers: { "Content-Type": "application/json", "x-goog-api-key": geminiApiKey },
                            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: gen })
                        });
                        const json = await response.json().catch(() => ({}));
                        if (json.error) {
                            errMsg = `${json.error.message || "Request failed"} (HTTP ${json.error.code || response.status}, ${model})`;
                            const code = json.error.code;
                            if (code === 404 || code === 400 && /model|thinking/i.test(json.error.message || "")) continue;
                            break;
                        }
                        data = json;
                        break;
                    } catch (e) {
                        errMsg = e && e.name === "AbortError" ? `Timed out waiting for ${model}` : `Network error: ${e && e.message ? e.message : e}`;
                    } finally {
                        clearTimeout(timer);
                    }
                }

                if (data) {
                    const rawText = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
                    let ids = null;
                    try {
                        const m = rawText.match(/\[[\s\S]*?\]/);
                        ids = JSON.parse(m ? m[0] : rawText.trim());
                    } catch (e) {
                        console.error("JSON Parsing Error from AI Output:", e, rawText);
                    }
                    if (Array.isArray(ids)) {
                        ids = ids.map(Number).filter(n => !isNaN(n) && state.products.some(p => Number(p.id) === n));
                        if (ids.length) {
                            state.aiSearchResults = ids;
                            state.category = "All";
                            showToast(`AI Search returned ${ids.length} recommended item(s) ✨`);
                        } else {
                            errMsg = "AI found no matching products";
                        }
                    } else {
                        errMsg = rawText ? "AI returned an unreadable response" : (data.promptFeedback?.blockReason ? "AI blocked this query" : "AI returned an empty response");
                    }
                }
            } catch (err) {
                console.error("Gemini Error:", err);
                errMsg = errMsg || (err && err.message) || "Unknown error";
            } finally {
                state.isAiSearching = false;
                if (!Array.isArray(state.aiSearchResults)) {
                    console.warn("AI search fell back to keyword search:", errMsg);
                }
                render();
            }
        }

                const { data: existing, error: eErr } = await supabaseClient.from("products").select("name");

                const have = new Set((existing || []).map(p => p.name));

        function getCartTotals() {
            let subtotal = 0;
            let totalItems = 0;

            for (const [id, qty] of Object.entries(state.cart)) {
                const prod = state.products.find(p => p.id == id);
                if (prod) {
                    subtotal += prod.price * qty;
                    totalItems += qty;
                }
            }

            const discountAmount = subtotal * state.discount;
            const tax = (subtotal - discountAmount) * 0.05;
            const shipping = subtotal > 150 || subtotal === 0 ? 0 : 15;
            const grandTotal = Math.max(0, subtotal - discountAmount + tax + shipping);

            return {
                subtotal: subtotal.toFixed(2),
                discountAmount: discountAmount.toFixed(2),
                tax: tax.toFixed(2),
                shipping: shipping.toFixed(2),
                grandTotal: grandTotal.toFixed(2),
                totalItems
            };
        }

        async function processCheckout(event) {
            event.preventDefault();

            const name = document.getElementById("custName").value.trim();
            const email = document.getElementById("custEmail").value.trim();
            const phone = document.getElementById("custPhone").value.trim();
            const address = document.getElementById("custAddress").value.trim();
            const city = document.getElementById("custCity").value.trim();
            const addrState = document.getElementById("custState").value.trim();
            const pincode = document.getElementById("custPincode").value.trim();
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked')?.value || "Credit Card";

            if (!name || !address) {
                alert("Please provide your name and delivery address!");
                return;
            }

            const totals = getCartTotals();
            if (totals.totalItems === 0) {
                alert("Your cart is empty!");
                return;
            }

            const orderItems = Object.entries(state.cart).map(([id, qty]) => {
                const prod = state.products.find(p => p.id == id);
                return {
                    product_id: Number(id),
                    name: prod ? prod.name : "Product #" + id,
                    price: prod ? prod.price : 0,
                    quantity: qty,
                    item_total: (prod ? prod.price * qty : 0).toFixed(2)
                };
            });

            let orderCode = "ORD-" + Math.floor(100000 + Math.random() * 900000);
            const orderPayload = {
                order_code: orderCode,
                user_email: (state.currentUser && state.currentUser.role !== "guest" && state.currentUser.email) ? state.currentUser.email : (email || "guest@store.com"),
                customer_name: name,
                phone: phone,
                address: `${address}, ${city}, ${addrState} - ${pincode}`,
                payment_method: paymentMethod,
                total_amount: parseFloat(totals.grandTotal),
                discount: parseFloat(totals.discountAmount),
                status: "Confirmed",
                items: orderItems
            };

            if (supabaseClient && isSupabaseConnected) {
                try {
                    const { data, error } = await supabaseClient.rpc("fn_place_order", {
                        p_user_id: (state.currentUser.role !== "guest" && state.currentUser.id) ? state.currentUser.id : null,
                        p_name: name, p_phone: phone, p_line1: address, p_city: city, p_state: addrState, p_pincode: pincode,
                        p_method: paymentMethod, p_discount_rate: state.discount,
                        p_items: orderItems.map(i => ({ product_id: i.product_id, quantity: i.quantity }))
                    });
                    if (error) {
                        alert("Order failed: " + error.message);
                        return;
                    }
                    orderCode = data[0].order_code;
                    showToast(`Order #${orderCode} saved in Supabase PostgreSQL! 🚀`);
                    fetchProductsFromSupabase();
                    fetchOrdersFromSupabase();
                } catch (e) {
                    saveOrderLocally(orderPayload);
                }
            } else {
                saveOrderLocally(orderPayload);
                showToast(`Order #${orderCode} placed (Local Demo)!`);
            }

            recordDbFlow(
                `Place Order (#${orderCode}) - Customer: ${name}`,
                `SELECT * FROM fn_place_order(user_id, '${name}', '${phone}', '${address}', '${city}', '${addrState}', '${pincode}', '${paymentMethod}', ${state.discount}, '[${totals.totalItems} items as JSONB]');\n\n-- Inside the function: INSERT addresses, orders, order_items, payments\n-- Triggers: trg_check_stock (BEFORE) + trg_reduce_stock (AFTER) on order_items`,
                "PostgreSQL Transaction: fn_place_order writes address, order, order_items and payment; row triggers validate and decrement stock",
                `INSERT into addresses, orders, order_items, payments; UPDATE products (stock decremented by trigger)`,
                `Order #${orderCode} Confirmed & Recorded in Database`
            );

            clearCart();
            setView("orders");
        }

        function saveOrderLocally(order) {
            order.created_at = new Date().toISOString();
            (order.items || []).forEach(i => {
                const prod = state.products.find(p => p.id == i.product_id);
                if (prod) prod.stock = Math.max(0, prod.stock - i.quantity);
            });
            state.orders.unshift(order);
            localStorage.setItem("apex_mock_orders", JSON.stringify(state.orders));
        }

        function _renderInner() {
            const container = document.getElementById("mainContainer");
            if (!container) return;


            const headerRoleBadge = document.getElementById("headerRoleBadge");
            if (headerRoleBadge) {
                const r = state.currentUser.role;
                headerRoleBadge.innerHTML = `
                    <span class="role-pill ${r}">
                        ${r === 'manager' ? '⭐ Manager' : r === 'customer' ? '👤 Customer' : '🚶 Guest'}
                    </span>
                `;
            }

            updateHeaderCartBadge();


            if (state.view === "auth") {
                renderAuthPage(container);
                return;
            }


            let productList = state.products;


            if (Array.isArray(state.aiSearchResults)) {
                productList = productList.filter(p => state.aiSearchResults.includes(Number(p.id)));
            } else {
                if (state.category !== "All") {
                    productList = productList.filter(p => p.category === state.category);
                }
                if (state.search.trim() && !state.isAiSearching) {
                    productList = keywordFilter(productList, state.search);
                }
            }

            if (state.sortBy === "price-low") {
                productList = [...productList].sort((a, b) => a.price - b.price);
            } else if (state.sortBy === "price-high") {
                productList = [...productList].sort((a, b) => b.price - a.price);
            } else if (state.sortBy === "rating") {
                productList = [...productList].sort((a, b) => (b.rating || 0) - (a.rating || 0));
            }


            let mainContentHtml = "";

            if (state.view === "shop") {
                mainContentHtml = `
                    <div class="tools">
                        <div class="search-bar-container">
                            <input 
                                class="search-bar" 
                                id="mainSearchInput"
                                placeholder="🔍 Ask AI or search products (e.g. 'i need airpods')..." 
                                value="${String(state.search).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}"
                                oninput="handleSearchInput(event)"
                                onkeydown="handleSearchKeyDown(event)"
                            >
                            <button 
                                class="ai-search-btn" 
                                onclick="executeAiSearch()"
                                ${state.isAiSearching ? 'disabled' : ''}
                            >
                                ${state.isAiSearching ? '✨ Thinking...' : '✨ AI Search'}
                            </button>

        function getCategoryIcon(cat) {
            switch (cat) {
                case "Electronics": return "💻";
                case "Audio & Wearables": return "🎧";
                case "Gaming": return "🎮";
                case "Fashion": return "👟";
                case "Home & Office": return "⚡";
                case "Books": return "📚";
                case "Sports": return "🧘";
                case "Beauty": return "💄";
                case "Toys": return "🧸";
                case "Groceries": return "🍎";
                default: return "📦";

        const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        async function loadReviews(productId) {
            if (supabaseClient && isSupabaseConnected) {
                const { data, error } = await supabaseClient.from("reviews")
                    .select("review_id, user_id, rating, comment, review_date, users(full_name)")
                    .eq("product_id", productId).order("review_date", { ascending: false });
                if (error) { console.warn(error.message); return []; }
                return data.map(r => ({ id: r.review_id, user_id: r.user_id, name: r.users ? r.users.full_name : "User", rating: r.rating, comment: r.comment, date: r.review_date }));
            }
            return JSON.parse(localStorage.getItem("apex_mock_reviews") || "[]").filter(r => r.product_id == productId);
        }

        async function openReviewsModal(productId) {
            const prod = state.products.find(p => p.id == productId);
            const reviews = await loadReviews(productId);
            const me = state.currentUser;
            const canReview = me.role !== "guest";
            const mine = reviews.find(r => r.user_id == me.id || (!me.id && r.name === me.full_name));
            document.getElementById("modalContainer").innerHTML = `
                <div class="modal-overlay" onclick="if(event.target === this) closeModals()">
                    <div class="modal-card" style="max-height:85vh; overflow:auto;">
                        <button class="modal-close" onclick="closeModals()">✕</button>
                        <h2 style="margin-bottom:4px;">${prod ? prod.icon : ''} ${prod ? esc(prod.name) : 'Product'} – Reviews</h2>
                        <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">Average rating: ⭐ ${prod ? prod.rating : '-'} (${reviews.length} review${reviews.length === 1 ? '' : 's'})</p>
                        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
                            ${reviews.length === 0 ? '<p style="color:var(--text-muted); font-size:13px;">No reviews yet. Be the first!</p>' : reviews.map(r => `
                                <div style="border:1px solid var(--border); border-radius:8px; padding:8px 12px; background:white;">
                                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                                        <strong>${esc(r.name)}</strong><span>${'⭐'.repeat(r.rating)}</span>
                                    </div>
                                    <div style="font-size:12.5px; margin-top:2px;">${esc(r.comment) || '<em>No comment</em>'}</div>
                                    ${(mine && mine.id === r.id) || me.role === 'manager' ? `<button class="delete-btn" style="margin-top:6px;" onclick="deleteReview(${productId}, ${r.id})">Delete</button>` : ''}
                                </div>`).join("")}
                        </div>
                        ${canReview ? `
                            <form onsubmit="submitReview(event, ${productId})">
                                <h3 style="font-size:14px; margin-bottom:8px;">${mine ? 'Update your review' : 'Write a review'}</h3>
                                <div class="form-group"><label>Rating</label>
                                    <select class="form-control" id="revRating">${[5,4,3,2,1].map(n => `<option value="${n}" ${mine && mine.rating === n ? 'selected' : ''}>${n} ⭐</option>`).join("")}</select></div>
                                <div class="form-group"><label>Comment</label>
                                    <input class="form-control" id="revComment" maxlength="300" value="${mine ? esc(mine.comment) : ''}" placeholder="What did you think?"></div>
                                <button type="submit" class="place-order-btn" style="margin-top:0;">${mine ? 'Update Review' : 'Submit Review'}</button>
                            </form>` : `<p style="font-size:13px; color:var(--text-muted);">Log in with a customer account to write a review.</p>`}
                    </div>
                </div>`;
        }

        async function submitReview(event, productId) {
            event.preventDefault();
            const rating = parseInt(document.getElementById("revRating").value);
            const comment = document.getElementById("revComment").value.trim();
            const me = state.currentUser;
            if (supabaseClient && isSupabaseConnected && me.id) {
                const { error } = await supabaseClient.from("reviews")
                    .upsert({ product_id: productId, user_id: me.id, rating, comment }, { onConflict: "product_id,user_id" });
                if (error) { alert("Review error: " + error.message); return; }
                await fetchProductsFromSupabase();
            } else {
                const all = JSON.parse(localStorage.getItem("apex_mock_reviews") || "[]").filter(r => !(r.product_id == productId && r.name === me.full_name));
                all.push({ id: Date.now(), product_id: productId, name: me.full_name, rating, comment, date: new Date().toISOString() });
                localStorage.setItem("apex_mock_reviews", JSON.stringify(all));
            }
            showToast("Review saved ⭐");
            recordDbFlow(`Review on product #${productId} by ${me.username}`,
                `INSERT INTO reviews (product_id, user_id, rating, comment)\nVALUES (${productId}, ${me.id || '?'}, ${rating}, '${comment}')\nON CONFLICT (product_id, user_id) DO UPDATE SET rating = EXCLUDED.rating, comment = EXCLUDED.comment;`,
                "Trigger trg_update_rating fires AFTER INSERT/UPDATE on reviews",
                "INSERT/UPDATE reviews; UPDATE products.rating = AVG(reviews.rating)", "Review stored and product rating recalculated");
            openReviewsModal(productId);
        }

        async function deleteReview(productId, reviewId) {
            if (!confirm("Delete this review?")) return;
            if (supabaseClient && isSupabaseConnected) {
                const { error } = await supabaseClient.from("reviews").delete().eq("review_id", reviewId);
                if (error) { alert("Delete error: " + error.message); return; }
                await fetchProductsFromSupabase();
            } else {
                const all = JSON.parse(localStorage.getItem("apex_mock_reviews") || "[]").filter(r => r.id != reviewId);
                localStorage.setItem("apex_mock_reviews", JSON.stringify(all));
            }
            showToast("Review deleted");
            recordDbFlow(`Delete review #${reviewId}`, `DELETE FROM reviews WHERE review_id = ${reviewId};`,
                "Trigger trg_update_rating fires AFTER DELETE", "DELETE 1 row; products.rating recalculated", "Review removed");
            openReviewsModal(productId);
        }

        function saveSupabaseConfig(event) {
            event.preventDefault();
            const url = document.getElementById("modalSupabaseUrl").value.trim();
            const key = document.getElementById("modalSupabaseKey").value.trim();

            supabaseConfig.url = url;
            supabaseConfig.key = key;

            localStorage.setItem("apex_supabase_url", url);
            localStorage.setItem("apex_supabase_key", key);

            closeModals();
            initSupabase();
            showToast("Connecting to Supabase...");
        }

        function clearSupabaseConfig() {
            localStorage.removeItem("apex_supabase_url");
            localStorage.removeItem("apex_supabase_key");
            supabaseConfig.url = "";
            supabaseConfig.key = "";
            supabaseClient = null;
            isSupabaseConnected = false;
            state.products = [...DEFAULT_PRODUCTS];
            closeModals();
            initSupabase();
            showToast("Switched back to local Demo mode");
        }

        function closeModals() {
            document.getElementById("modalContainer").innerHTML = "";
        }

        function showToast(message) {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerHTML = `<span>⚡</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transition = "opacity 0.4s";
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }


        const dbFlowHistory = [];

        function recordDbFlow(operation, sqlQuery, processing, updateRetrieval, result) {
            const entry = {
                timestamp: new Date().toLocaleTimeString(),
                operation,
                sqlQuery,
                processing,
                updateRetrieval,
                result
            };
            dbFlowHistory.unshift(entry);

            showDbFlowToast(entry);
        }

        function showDbFlowToast(entry) {
            let banner = document.getElementById("dbFlowToastBanner");
            if (!banner) {
                banner = document.createElement("div");
                banner.id = "dbFlowToastBanner";
                banner.className = "db-flow-toast";
                document.body.appendChild(banner);
            }

            banner.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 6px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 15px;">📊</span>
                        <strong style="color: #f8fafc; font-size: 12.5px;">Interactive Database Demonstration Flow</strong>
                        <span style="font-size: 10px; background: #3b82f6; padding: 2px 6px; border-radius: 4px; color: white; font-weight: 700;">LIVE</span>
                    </div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button onclick="openDbFlowModal()" style="background: #334155; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600;">Detailed Flow Modal ➔</button>
                        <button onclick="document.getElementById('dbFlowToastBanner').remove()" style="background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer;">✕</button>
                    </div>
                </div>

                <div class="db-flow-steps">
                    <div class="db-flow-step">
                        <div class="db-flow-step-title">1. User Operation</div>
                        <div>${entry.operation}</div>
                    </div>
                    <div class="db-flow-step">
                        <div class="db-flow-step-title">2. SQL / PL/SQL</div>
                        <div class="db-flow-step-code">${entry.sqlQuery}</div>
                    </div>
                    <div class="db-flow-step">
                        <div class="db-flow-step-title">3. DB Processing</div>
                        <div>${entry.processing}</div>
                    </div>
                    <div class="db-flow-step">
                        <div class="db-flow-step-title">4. DB Update/Retrieval</div>
                        <div>${entry.updateRetrieval}</div>
                    </div>
                    <div class="db-flow-step">
                        <div class="db-flow-step-title">5. Result</div>
                        <div style="color: #4ade80; font-weight: 600;">${entry.result}</div>
                    </div>
                </div>
            `;

            clearTimeout(window._dbFlowTimer);
            window._dbFlowTimer = setTimeout(() => {
                const b = document.getElementById("dbFlowToastBanner");
                if (b) b.remove();
            }, 8000);
        }

        function openDbFlowModal() {
            const container = document.getElementById("modalContainer");
            const latest = dbFlowHistory[0] || {
                operation: "Browse Catalog & View Products",
                sqlQuery: "SELECT * FROM public.products ORDER BY id ASC;",
                processing: "PostgreSQL sequential scan & primary key index sort",
                updateRetrieval: "20 rows retrieved from public.products table",
                result: "Catalog rendered with 20 items in grid"
            };

            container.innerHTML = `
                <div class="modal-overlay" onclick="if(event.target === this) closeModals()">
                    <div class="modal-card" style="max-width: 820px;">
                        <button class="modal-close" onclick="closeModals()">✕</button>
                        <h2 style="margin-bottom: 6px;">📊 Interactive Database Demonstration Flow</h2>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
                            Demonstrating the exact 5-step database flow:
                            <code>User Operation ➔ SQL/PL/SQL ➔ Database Processing ➔ Database Update/Retrieval ➔ Result</code>
                        </p>

                        <div style="background: #0f172a; color: white; padding: 18px; border-radius: 12px; margin-bottom: 20px;">
                            <div style="font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; text-transform: uppercase;">
                                Active Transaction Flow:
                            </div>

                            <div style="display: flex; flex-direction: column; gap: 12px;">
                                <div style="background: #1e293b; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #3b82f6;">
                                    <strong style="color: #60a5fa; font-size: 12px;">1. USER OPERATION:</strong><br>
                                    <span style="font-size: 13px;">${latest.operation}</span>
                                </div>
                                <div style="background: #1e293b; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #a855f7;">
                                    <strong style="color: #c084fc; font-size: 12px;">2. SQL / PL/SQL EXECUTED:</strong><br>
                                    <pre style="color: #86efac; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; margin-top: 4px; line-height: 1.4;">${latest.sqlQuery}</pre>
                                </div>
                                <div style="background: #1e293b; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #eab308;">
                                    <strong style="color: #fde047; font-size: 12px;">3. DATABASE PROCESSING:</strong><br>
                                    <span style="font-size: 13px;">${latest.processing}</span>
                                </div>
                                <div style="background: #1e293b; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #ec4899;">
                                    <strong style="color: #f472b6; font-size: 12px;">4. DATABASE UPDATE / RETRIEVAL:</strong><br>
                                    <span style="font-size: 13px;">${latest.updateRetrieval}</span>
                                </div>
                                <div style="background: #1e293b; padding: 10px 14px; border-radius: 8px; border-left: 4px solid #22c55e;">
                                    <strong style="color: #4ade80; font-size: 12px;">5. RESULT:</strong><br>
                                    <span style="font-size: 13px;">${latest.result}</span>
                                </div>
                            </div>
                        </div>

                        <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px; font-size: 12px; color: #1e40af; margin-bottom: 16px;">
                            <strong>⚡ PL/pgSQL Trigger & Stored Procedure Highlight:</strong><br>
                            When an order is inserted into the <code>orders</code> table, the PostgreSQL trigger <code>trg_reduce_stock_after_order</code> executes the PL/pgSQL function <code>process_order_stock_reduction()</code> to automatically decrement inventory stock in the <code>products</code> table!
                        </div>

                        <button class="place-order-btn" onclick="closeModals()">
                            Close Demonstration Flow
                        </button>
                    </div>
                </div>
            `;
        }

        document.addEventListener("DOMContentLoaded", () => {
            initSupabase();
            render();
        });
    </script>
